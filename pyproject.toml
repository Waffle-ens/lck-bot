[project]
name = "lck-discord-bot"
version = "0.1.0"
description = "Discord bot for LCK match roster, live status, and results."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.5",
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
